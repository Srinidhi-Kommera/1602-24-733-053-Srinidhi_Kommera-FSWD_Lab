<!DOCTYPE html>
<html>
<head>
    <title>Internship Details</title>

    <style>
        table {
            width: 90%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: "Times New Roman", Times, serif;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #e8f0f8;
            color: #174a7c;
        }

        .duration {
            background-color: #eaf4dc;
        }

        .period {
            background-color: #fff1dc;
        }

        .performance {
            background-color: #f8e5eb;
        }

        td {
            height: 25px;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th rowspan="2">Sr.no</th>
        <th rowspan="2">Details of internship</th>
        <th rowspan="2" class="duration">Duration (months)</th>
        <th colspan="2" class="period">Internship period</th>
        <th colspan="3" class="performance">Internship performance details</th>
    </tr>

    <tr>
        <th class="period">From</th>
        <th class="period">To</th>
        <th class="performance">S.no</th>
        <th class="performance">Skill gained</th>
        <th class="performance">Mentor remarks</th>
    </tr>

    <tr>
        <td rowspan="2">1</td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td>1</td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>2</td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td rowspan="2">2</td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td>1</td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>2</td>
        <td></td>
        <td></td>
    </tr>
</table>

</body>
</html>
